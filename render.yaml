# Render Blueprint for HarmonyHub.
# In Render: New + → Blueprint → pick this repo. It provisions BOTH the web
# service and a free PostgreSQL database, wired together automatically.
databases:
  - name: harmonyhub-db
    plan: free
    region: oregon

services:
  - type: web
    name: harmonyhub
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      # Render injects the database connection string here automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: harmonyhub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
